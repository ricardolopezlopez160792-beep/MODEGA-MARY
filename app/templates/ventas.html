{% extends "base.html" %}
{% block titulo %}Ventas{% endblock %}
{% block contenido %}
<h1>Ventas <a class="boton" href="{{ url_for('nueva_venta') }}">+ Nueva venta</a></h1>
<form class="filtros" method="get">
  <label>Desde <input type="date" name="desde" value="{{ desde }}"></label>
  <label>Hasta <input type="date" name="hasta" value="{{ hasta }}"></label>
  <label>Estado
    <select name="estado">
      <option value="">Todos</option>
      {% for e in ['PAGADA','FIADO','ANULADA'] %}<option {{ 'selected' if e == estado }}>{{ e }}</option>{% endfor %}
    </select>
  </label>
  <button>Filtrar</button>
</form>
<p class="nota">Se muestran las 200 más recientes según el filtro.</p>
{% with lista=ventas %}{% include "_tabla_ventas.html" %}{% endwith %}
{% endblock %}
